name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0 or 0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine & Create Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_VER="${{ github.event.inputs.version }}"
            if [[ "$INPUT_VER" != v* ]]; then
              TAG="v${INPUT_VER}"
            else
              TAG="${INPUT_VER}"
            fi
            echo "TAG_NAME=${TAG}" >> $GITHUB_OUTPUT

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Creating git tag ${TAG}..."
              git tag -a "$TAG" -m "Release ${TAG}"
              git push origin "$TAG"
            fi
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libvulkan-dev \
            libssl-dev \
            libdbus-1-dev \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package Release Assets
        run: |
          mkdir -p dist
          if [ -f target/x86_64-unknown-linux-gnu/release/capsule ]; then
            cp target/x86_64-unknown-linux-gnu/release/capsule dist/capsule
          else
            cp target/x86_64-unknown-linux-gnu/release/Capsule dist/capsule
          fi
          chmod +x dist/capsule
          tar -czvf capsule-x86_64-unknown-linux-gnu.tar.gz -C dist capsule

      - name: Prepare Release Body
        id: release_body
        run: |
          CHANGELOG_FILE="docs/CHANGELOG.md"
          if [ -f "$CHANGELOG_FILE" ] && [ -s "$CHANGELOG_FILE" ]; then
            echo "BODY_PATH=$CHANGELOG_FILE" >> $GITHUB_OUTPUT
          else
            echo "Release ${{ steps.tag_info.outputs.TAG_NAME }}" > default_changelog.txt
            echo "BODY_PATH=default_changelog.txt" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: Release ${{ steps.tag_info.outputs.TAG_NAME }}
          body_path: ${{ steps.release_body.outputs.BODY_PATH }}
          files: |
            capsule-x86_64-unknown-linux-gnu.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
