[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
license = "MIT"

[workspace.dependencies]
gpui = { package = "gpui-ce", path = "../gpui-ce/crates/gpui", features = ["wayland"] }
gpui_platform = { package = "gpui_ce_platform", path = "../gpui-ce/crates/gpui_platform", features = ["wayland"] }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1.0.104"
toml = "1.1.3"
dirs = "6.0.0"

assets = { path = "crates/assets" }
chrono = "0.4.39"
hyprland = "0.3.13"
niri-ipc = "26.4.0"
mango-ipc = "0.6.0"
fend-core = "1.5.8"


futures-util = { version = "0.3.30", default-features = false }
futures-signals = "0.3.34"
futures = "0.3.31"
